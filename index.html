<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário Completo</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <h1>Formulário Completo</h1>

    <form>

        <fieldset>
            <legend>Dados Pessoais</legend>

            <label class="campo" for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <br><br>

            <label class="campo" for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome">
            <br><br>

            <label class="campo" for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label class="campo" for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
            <br><br>

            <label class="campo" for="data">Data de Nascimento:</label>
            <input type="date" id="data" name="data">

        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label class="campo" for="rua">Rua:</label>
            <input type="text" id="rua" name="rua">
            <br><br>

            <label class="campo" for="numero">Número:</label>
            <input type="text" id="numero" name="numero">
            <br><br>

            <label class="campo" for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade">
            <br><br>

            <label class="campo" for="estado">Estado:</label>
            <input type="text" id="estado" name="estado">
            <br><br>

            <label class="campo" for="cep">CEP:</label>
            <input type="text" id="cep" name="cep">

        </fieldset>

        <fieldset>
            <legend>Preferências</legend>

            <label for="cor">Cor Favorita:</label>

            <select id="cor" name="cor">
                <option>Vermelho</option>
                <option>Azul</option>
                <option>Verde</option>
                <option>Amarelo</option>
            </select>

            <br>

            <label>Gênero:</label>

            <input type="radio" id="masculino" name="genero">
            <label for="masculino">Masculino</label>

            <input type="radio" id="feminino" name="genero">
            <label for="feminino">Feminino</label>

            <br>

            <label>Interesses:</label>
            <br>

            <input type="checkbox" id="esportes">
            <label for="esportes">Esportes</label>
            <br>

            <input type="checkbox" id="musica">
            <label for="musica">Música</label>
            <br>

            <input type="checkbox" id="tecnologia">
            <label for="tecnologia">Tecnologia</label>

        </fieldset>

        <fieldset>
            <legend>Upload de Arquivos</legend>

            <label for="arquivo">Escolha um arquivo:</label>
            <input type="file" id="arquivo" name="arquivo">

        </fieldset>

        <fieldset>
            <legend>Informações de Login</legend>

            <label class="campo" for="usuario">Nome de Usuário:</label>
            <input type="text" id="usuario" name="usuario">
            <br><br>

            <label class="campo" for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">
            <br><br>

            <label class="campo" for="confirmar">Confirmar Senha:</label>
            <input type="password" id="confirmar" name="confirmar">

        </fieldset>

        <input type="submit" value="Enviar">

    </form>

</body>

</html>
